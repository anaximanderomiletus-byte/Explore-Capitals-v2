    <!-- GitHub Pages SPA redirect handler -->
    <script>
      // Restores the correct URL after 404.html redirect (GitHub Pages SPA workaround)
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>

      /* ===== CROSS-BROWSER NORMALIZATION ===== */
      
      /* Define viewport height CSS variable for iOS consistency */

      /* Font smoothing for all browsers */

        -webkit-tap-highlight-color: transparent;

        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);

      /* iOS overscroll bounce: extend dark background into bounce region.
         A massive box-shadow on body fills the area revealed during
         rubber-band scrolling so no white flash appears. */
      body::before {
        content: '';

        top: -100vh;
        left: 0;
        right: 0;
        bottom: -100vh;
        background-color: #0F172A;

        /* Prevent horizontal overflow but allow vertical scroll */
        overflow-x: hidden;

      /* ===== TOUCH DEVICE: disable sticky hover ===== */
      /* On touch-only devices (no mouse), CSS :hover sticks after a tap.
         This resets ALL hover-triggered visual changes so elements don't

      @media (hover: none) and (pointer: coarse) {

      /*
