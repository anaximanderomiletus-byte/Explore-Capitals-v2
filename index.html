    <!-- Browser detection and viewport height fix - runs immediately before React -->
    <script>
      (function() {
        var ua = navigator.userAgent.toLowerCase();
        var isIOS = /ipad|iphone|ipod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isSafari = ua.includes('safari') && !ua.includes('chrome') && !ua.includes('android');
        var isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        
        if (isSafari) document.documentElement.classList.add('is-safari');
        if (isIOS) document.documentElement.classList.add('is-ios');
        if (isTouch) document.documentElement.classList.add('is-touch');
        if ((isSafari && isIOS) || (isSafari && isTouch)) {
          document.documentElement.classList.add('reduce-effects');
        }
        
        // Calculate and set accurate viewport height for iOS
        // This fixes the 100vh issue on iOS where it includes the URL bar
        function setViewportHeight() {
          var vh = window.innerHeight * 0.01;
          document.documentElement.style.setProperty('--vh', vh + 'px');
          document.documentElement.style.setProperty('--viewport-height', window.innerHeight + 'px');
        }
        
        setViewportHeight();
        
        // Update on resize and orientation change
        var resizeTimeout;
        window.addEventListener('resize', function() {
          clearTimeout(resizeTimeout);
          resizeTimeout = setTimeout(setViewportHeight, 100);
        }, { passive: true });
        
        window.addEventListener('orientationchange', function() {
          setTimeout(setViewportHeight, 200);
        }, { passive: true });
      })();
    </script>

    <script>
      // Remove loader once the actual page content has rendered.
      // Pages call window.__dismissLoader() when they mount, so the splash
      // stays until real content is visible (no double-spinner flash).
      (function() {
        var loader = document.getElementById('initial-loader');
        if (!loader) return;

        function dismissLoader() {
          if (!loader) return;
          loader.style.pointerEvents = 'none';
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
          var el = loader;
          loader = null;
          setTimeout(function() { if (el && el.parentNode) el.remove(); }, 500);
        }

        // Expose so pages can call it when mounted
        window.__dismissLoader = function() {
          requestAnimationFrame(function() {
            requestAnimationFrame(dismissLoader);
          });
        };

        // Safety timeout - never show loader for more than 4 seconds
        setTimeout(dismissLoader, 4000);
      })();
    </script>
