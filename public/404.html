<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ExploreCapitals</title>
  <script>
    // Cloudflare Pages SPA fallback
    // Preserve the full path so React Router can handle client-side routing
    var path = window.location.pathname + window.location.search + window.location.hash;
    if (path !== '/') {
      sessionStorage.setItem('spa_redirect', path);
      window.location.replace('/');
    }
  </script>
</head>
<body>
</body>
</html>
